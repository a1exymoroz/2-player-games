<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Машинки</title>
    <!-- No logo, no progress bar: the page is the game's sky colour until the first frame draws. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #CDE7F0; }
      #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/Web.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Web.data.unityweb",
        frameworkUrl: "Build/Web.framework.js.unityweb",
        codeUrl: "Build/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Машинки",
        productVersion: "1.0",
      }).catch((message) => {
        document.body.textContent = "Не удалось запустить игру: " + message;
      });
    </script>
  </body>
</html>
