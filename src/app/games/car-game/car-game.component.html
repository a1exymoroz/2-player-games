<div class="game-container">
  <header class="game-header">
    <a routerLink="/" class="back-button">
      <span class="arrow">←</span>
      <span>Back to Games</span>
    </a>
    <h1>Car Duel</h1>
    <div class="level-switcher">
      <button class="level-btn" (click)="changeLevel(-1)" aria-label="Previous level">◀</button>
      <span class="level-name">{{ currentLevel.name }} <span class="level-count">{{ currentLevelIndex + 1 }}/{{ levelCount }}</span></span>
      <button class="level-btn" (click)="changeLevel(1)" aria-label="Next level">▶</button>
    </div>
  </header>

  <div class="track-wrapper">
    <canvas #canvas class="track"></canvas>

    @if (gameOverMessage) {
      <div class="game-over-overlay">
        <p class="game-over-message" [style.background]="gameOverGradient">{{ gameOverMessage }}</p>
      </div>
    }
  </div>

  <div class="hint">
    <span class="player-hint player-hint--red">Player 1: <kbd>←</kbd> reverse · <kbd>→</kbd> accelerate</span>
    <span class="player-hint player-hint--blue">Player 2: <kbd>A</kbd> reverse · <kbd>D</kbd> accelerate</span>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" (click)="resetCars()">Reset Positions</button>
  </div>
</div>
